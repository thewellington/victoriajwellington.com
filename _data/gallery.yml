# Photo gallery catalog.
#
# Naming (files under assets/images/gallery/):
#   YYYY-theme-##.jpg
#   Examples: 2025-wabun-01.jpg, 2026-rowing-03.jpg, 2026-street-01.jpg
# Thumbs (optional, same filename):
#   assets/images/gallery/thumbs/YYYY-theme-##.jpg  (~800px wide)
#
# Fields:
#   image     — full-size path (required)
#   thumb     — grid image; falls back to image if omitted
#   title     — short label under the photo
#   caption   — one-line description
#   category  — optional (e.g. wabun, rowing, street, nature); for future filters
#   year      — optional four-digit year
#
# Titles/captions are provisional — refine with Victoria.

